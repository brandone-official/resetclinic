<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design C — Word Highlight</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* =========================================
   DESIGN C: Word Highlight + Sticky Empathy
   Ref: Toss, 카카오뱅크, Korean contemporary
   ─ 흰 배경, 텍스트 중심의 극단적 미니멀
   ─ 문장 내 핵심 단어에만 오렌지/네이비 강조
   ─ 오렌지 단어 등장 시 밑줄 sweep 애니메이션
   ─ 공감 섹션: sticky 고정 + 스크롤 문장 교체
   ========================================= */

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --white:  #ffffff;
  --text:   #1a1a1a;
  --muted:  #aaa;
  --soft:   #666;
  --orange: #d76618;
  --navy:   #1a3270;
  --line:   #ebebeb;
}

html{scroll-behavior:smooth}
body{
  background:var(--white);
  color:var(--text);
  font-family:'PretendardVariable','Pretendard',-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

/* ── Reveal ─────────────────────────────── */
.reveal{
  opacity:0;
  transform:translateY(20px);
  transition:
    opacity .9s cubic-bezier(.22,1,.36,1),
    transform .9s cubic-bezier(.22,1,.36,1);
}
.reveal.visible{opacity:1;transform:none}

/* ── 핵심 단어 강조 ──────────────────────── */
.hi-orange{color:var(--orange)}
.hi-navy  {color:var(--navy)}

.hi-orange{
  position:relative;
  display:inline;
}
.hi-orange::after{
  content:'';
  position:absolute;
  left:0;bottom:-.1em;
  height:2px;
  width:0;
  background:var(--orange);
  transition:width .55s cubic-bezier(.22,1,.36,1) .5s;
}
.reveal.visible .hi-orange::after{width:100%}

/* ── 1. Hero ─────────────────────────────── */
.s-hero{
  min-height:100vh;
  min-height:100svh;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding:0 28px 80px;
}

.hero-kicker{
  font-size:.7rem;
  font-weight:500;
  letter-spacing:.2em;
  color:var(--muted);
  text-transform:uppercase;
  margin-bottom:32px;
}

.hero-text p{
  font-size:clamp(2.6rem,9.8vw,5.2rem);
  font-weight:700;
  line-height:1.2;
  letter-spacing:-.045em;
  word-break:keep-all;
  color:var(--text);
}

/* ── 2. Bridge ───────────────────────────── */
.s-bridge{
  padding:96px 28px 112px;
  border-top:1px solid var(--line);
}

.bridge-inner{
  display:flex;
  flex-direction:column;
  gap:28px;
}

.bp-1{
  font-size:clamp(1rem,3.6vw,1.4rem);
  font-weight:300;
  line-height:1.75;
  letter-spacing:-.015em;
  word-break:keep-all;
  color:var(--soft);
}
.bp-2{
  font-size:clamp(1.9rem,7vw,3.2rem);
  font-weight:700;
  line-height:1.25;
  letter-spacing:-.045em;
  word-break:keep-all;
  color:var(--text);
}
.bp-3{
  font-size:clamp(1rem,3.6vw,1.4rem);
  font-weight:300;
  line-height:1.75;
  letter-spacing:-.015em;
  word-break:keep-all;
  color:var(--navy);
}

/* ── 3. Empathy — Sticky Scroll ─────────── */

/* 스크롤 공간을 만드는 래퍼 */
.s-empathy-wrap{
  height:600vh;
  position:relative;
  border-top:1px solid var(--line);
}

/* 뷰포트에 고정되는 무대 */
.s-empathy-sticky{
  position:sticky;
  top:0;
  height:100vh;
  height:100svh;
  overflow:hidden;
}

/* 각 문장: 절대 중앙 배치, 기본 투명 */
.emp-sentence{
  position:absolute;
  top:50%;
  left:28px;right:28px;
  transform:translateY(-50%);
  line-height:1.22;
  letter-spacing:-.04em;
  word-break:keep-all;
  color:var(--text);
  opacity:0;
  transition:opacity .45s cubic-bezier(.22,1,.36,1);
  pointer-events:none;
}
.emp-sentence.active{
  opacity:1;
  pointer-events:auto;
}

/* 크기·무게 단계적 증가 */
.emp-sentence[data-step='1']{font-size:clamp(1.5rem,5.5vw,2.2rem); font-weight:300}
.emp-sentence[data-step='2']{font-size:clamp(1.9rem,7vw,2.9rem);   font-weight:400}
.emp-sentence[data-step='3']{font-size:clamp(2.4rem,9vw,3.8rem);   font-weight:500}
.emp-sentence[data-step='4']{font-size:clamp(3rem,11vw,5rem);      font-weight:600}
.emp-sentence[data-step='5']{
  font-size:clamp(3.4rem,13vw,6.5rem);
  font-weight:800;
  color:var(--text);
  transition:opacity .45s cubic-bezier(.22,1,.36,1), color .7s ease .2s;
}
.emp-sentence[data-step='5'].active{color:var(--orange)}

/* 진행 표시 — 하단 바 */
.emp-prog{
  position:absolute;
  bottom:40px;
  left:28px;
  display:flex;
  gap:7px;
  align-items:center;
}
.prog-bar{
  display:block;
  width:18px;height:2px;
  background:var(--line);
  border-radius:1px;
  transition:background .3s ease, width .3s cubic-bezier(.22,1,.36,1);
}
.prog-bar.filled{
  background:var(--orange);
  width:32px;
}

/* ── 4. Placeholder ──────────────────────── */
.s-placeholder{
  min-height:36vh;
  display:flex;
  align-items:center;
  padding:0 28px;
  border-top:1px solid var(--line);
}
.ph-line{display:block;width:28px;height:1.5px;background:#d4d4d4}

/* ── Desktop ─────────────────────────────── */
@media(min-width:640px){
  .s-hero{
    padding-left:max(64px,calc(50vw - 380px));
    padding-right:max(64px,calc(50vw - 380px));
  }
  .s-bridge{
    padding-left:max(64px,calc(50vw - 380px));
    padding-right:max(64px,calc(50vw - 380px));
  }
  .emp-sentence{
    left:max(64px,calc(50vw - 380px));
    right:max(64px,calc(50vw - 380px));
  }
  .emp-prog{
    left:max(64px,calc(50vw - 380px));
  }
  .s-placeholder{
    padding-left:max(64px,calc(50vw - 380px));
  }
}
</style>
</head>
<body>
<main>

<!-- 1. Hero -->
<section class="s-hero">
  <p class="hero-kicker reveal">전주W한의원</p>
  <div class="hero-text">
    <p class="reveal">지금 이 순간에도</p>
    <p class="reveal">답답한 마음에</p>
    <p class="reveal">이유라도 알고 싶어서</p>
    <p class="reveal"><span class="hi-orange">여기까지</span> 오셨나요?</p>
  </div>
</section>

<!-- 2. Bridge -->
<section class="s-bridge">
  <div class="bridge-inner">
    <div class="reveal"><p class="bp-1">여러분은 <span class="hi-navy">잘못한 게 없어요</span>.</p></div>
    <div class="reveal"><p class="bp-2"><span class="hi-orange">몸이 바뀐</span> 겁니다.</p></div>
    <div class="reveal"><p class="bp-3">저도 진료실에서 매일 드는 말이 있어요.</p></div>
  </div>
</section>

<!-- 3. Empathy — Sticky Scroll -->
<div class="s-empathy-wrap">
  <div class="s-empathy-sticky">

    <p class="emp-sentence active" data-step="1">작년에 입던 옷이 올해는 안 맞아요.</p>
    <p class="emp-sentence"        data-step="2">밥도 줄였는데 체중계 숫자는 그대로예요.</p>
    <p class="emp-sentence"        data-step="3">운동도 시작했는데 배는 오히려 더 나왔어요.</p>
    <p class="emp-sentence"        data-step="4">뭘 해도 안 되는 건지 나만 이상한 건지.</p>
    <p class="emp-sentence"        data-step="5">답을 찾고 싶어서 오늘도 검색하고 있어요.</p>

    <div class="emp-prog" aria-hidden="true">
      <span class="prog-bar filled"></span>
      <span class="prog-bar"></span>
      <span class="prog-bar"></span>
      <span class="prog-bar"></span>
      <span class="prog-bar"></span>
    </div>

  </div>
</div>

<!-- 4. Placeholder -->
<footer class="s-placeholder" aria-hidden="true">
  <span class="ph-line"></span>
</footer>

</main>
<script>
// ── Hero / Bridge Reveal ──────────────────
const ro = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('visible'); ro.unobserve(e.target); }
  });
}, { threshold: .3 });
document.querySelectorAll('.reveal').forEach(el => ro.observe(el));

// ── Sticky Empathy Scroll ─────────────────
const wrap      = document.querySelector('.s-empathy-wrap');
const sentences = [...document.querySelectorAll('.emp-sentence')];
const bars      = [...document.querySelectorAll('.prog-bar')];
const N         = sentences.length;
let cur         = 0;

function show(idx) {
  if (idx === cur && sentences[cur].classList.contains('active')) return;
  sentences.forEach((s, i) => s.classList.toggle('active', i === idx));
  bars.forEach((b, i) => b.classList.toggle('filled', i <= idx));
  cur = idx;
}

function onScroll() {
  const scrolled   = -wrap.getBoundingClientRect().top;      // px into the wrapper
  const scrollable = wrap.offsetHeight - window.innerHeight; // total scrollable px

  if (scrolled <= 0)          { show(0); return; }
  if (scrolled >= scrollable) { return; }

  const idx = Math.min(Math.floor((scrolled / scrollable) * N), N - 1);
  show(idx);
}

show(0);
window.addEventListener('scroll', onScroll, { passive: true });
</script>
</body>
</html>
