<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="갱년기, 안 빠지는 몸엔 리셋 다이어트" />
    <title>전주W한의원</title>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="전주W한의원" />
    <meta property="og:description" content="갱년기, 안 빠지는 몸엔 리셋 다이어트" />
    <meta property="og:image" content="https://resetclinic.web.app/images/og-image.png" />
    <meta property="og:url" content="https://resetclinic.web.app" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="전주W한의원" />
    <meta name="twitter:description" content="갱년기, 안 빠지는 몸엔 리셋 다이어트" />
    <meta name="twitter:image" content="https://resetclinic.web.app/images/og-image.png" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  </head>
  <body>
    <div id="root"></div>
    <script>
    (function() {
      var ua = navigator.userAgent || '';
      var isInApp = /KAKAOTALK|NAVER|Instagram|FBAN|FBAV|Youtube/i.test(ua);
      if (!isInApp) return;

      var url = location.href;
      document.getElementById('root').style.display = 'none';

      var overlay = document.createElement('div');
      overlay.id = 'inapp-overlay';
      overlay.innerHTML =
        '<div style="' +
          'min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;' +
          'padding:2rem;background:#F7F3EE;font-family:Pretendard Variable,sans-serif;text-align:center;color:#07112B' +
        '">' +
          '<p style="font-size:1.1rem;font-weight:600;color:#D76618;margin:0 0 1rem">전주W한의원</p>' +
          '<p style="font-size:1.6rem;font-weight:700;line-height:1.4;margin:0 0 0.75rem;letter-spacing:-0.02em">' +
            '외부 브라우저에서<br>열어주세요' +
          '</p>' +
          '<p style="font-size:1rem;font-weight:400;color:#666;line-height:1.6;margin:0 0 2.5rem;word-break:keep-all">' +
            '현재 앱 내 브라우저에서는<br>일부 기능이 제한될 수 있습니다.' +
          '</p>' +
          '<a id="inapp-open" style="' +
            'display:inline-block;background:#D76618;color:#fff;font-size:1.1rem;font-weight:600;' +
            'padding:1rem 2.5rem;border-radius:50px;text-decoration:none;letter-spacing:-0.01em;' +
            '-webkit-tap-highlight-color:transparent' +
          '">기본 브라우저로 열기</a>' +
          '<p style="font-size:0.85rem;color:#999;margin:1.5rem 0 0;line-height:1.5">' +
            '버튼이 동작하지 않으면<br>주소를 복사해 브라우저에 붙여넣어 주세요.' +
          '</p>' +
        '</div>';
      document.body.appendChild(overlay);

      var btn = document.getElementById('inapp-open');
      btn.addEventListener('click', function(e) {
        e.preventDefault();
        if (/iPhone|iPad/i.test(ua) && /KAKAOTALK/i.test(ua)) {
          location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url);
        } else if (/iPhone|iPad/i.test(ua)) {
          location.href = url.replace(/^https?:\/\//, 'x-safari-https://');
        } else {
          location.href = 'intent://' + url.replace(/^https?:\/\//, '') +
            '#Intent;scheme=https;package=com.android.chrome;end';
        }
      });
    })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
