<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trust Part 3 — 원장 프로필</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Pretendard Variable', 'Pretendard', -apple-system, 'Apple SD Gothic Neo', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /*
      섹션 배경:
      좌 50% → 크림 / 우 50% → 네이비
      800px 중앙 정렬 그리드의 중간선 = 뷰포트 50% 이므로
      어떤 뷰포트 너비에서도 패널 경계와 배경 경계가 정확히 일치.
      → 네이비가 우측 끝까지 풀블리드.
    */
    .s-profile {
      background: linear-gradient(to right, #F7F3EE 50%, #1A3270 50%);
    }

    /* max-width 800px 중앙 정렬 좌우 그리드 */
    .p-grid {
      max-width: 800px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    /* ── 좌측: 이미지 풀필 + 크림 그라디언트 오버레이 ── */
    .p-left {
      background: #F7F3EE;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 이미지: 영역 전체 채움 */
    .p-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: top center;
      display: block;
    }

    /* 크림 그라디언트 오버레이 (하단 페이드) */
    .p-overlay {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 48%;
      background: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(247, 243, 238, 0.8) 50%,
        #F7F3EE 100%
      );
      z-index: 1;
    }

    /* 이름/소속: 오버레이 위 */
    .p-caption {
      position: absolute;
      bottom: 32px;
      left: 0; right: 0;
      text-align: center;
      z-index: 2;
      padding: 0 20px;
    }

    /* tr-prof-name 계열 — 400px 컬럼 기준 vw 재조정 */
    .p-name {
      font-size: clamp(1.1rem, 1.4vw, 1.3rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      color: #1A1A1A;
      margin-bottom: 5px;
    }

    /* tr-prof-sub 계열 — color #999 일치 */
    .p-sub {
      font-size: clamp(0.78rem, 0.92vw, 0.88rem);
      font-weight: 400;
      color: #999;
      letter-spacing: -0.005em;
    }

    /* ── 우측: 네이비 + 앵커 카피 + 스토리 ── */
    .p-right {
      background: #1A3270;
      padding: 72px 52px 72px 64px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
    }

    /* 앵커 카피 — tr-ph-head 계열, 400px 컬럼 기준 */
    .p-anchor {
      font-size: clamp(1.8rem, 3.5vw, 2.8rem);
      font-weight: 800;
      letter-spacing: -0.045em;
      line-height: 1.22;
      color: #FFFFFF;
      word-break: keep-all;
      margin-bottom: 28px;
    }
    .p-anchor .hl { color: #D76618; }

    /* 오렌지 룰 (앵커-스토리 구분) */
    .p-rule {
      width: 32px;
      height: 2px;
      background: #D76618;
      margin-bottom: 24px;
    }

    /* 스토리 컨테이너 — 2단 레이어 */
    .p-story {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 레이어 1: 설정 문장 — 흐린 화이트, 300 */
    .p-story-lead {
      font-size: clamp(0.82rem, 1vw, 0.9rem);
      font-weight: 300;
      line-height: 1.9;
      letter-spacing: -0.01em;
      color: rgba(255, 255, 255, 0.45);
      word-break: keep-all;
    }

    /* 레이어 2: 결론 문장 — 밝은 화이트, 500 */
    .p-story-close {
      font-size: clamp(0.9rem, 1.14vw, 1rem);
      font-weight: 500;
      line-height: 1.7;
      letter-spacing: -0.02em;
      color: rgba(255, 255, 255, 0.92);
      word-break: keep-all;
    }

    /* 펀치라인 — 오렌지 강조 */
    .p-story-close .punch {
      color: #D76618;
    }
  </style>
</head>
<body>

  <section class="s-profile">
    <div class="p-grid">

      <!-- 좌측: 이미지 + 오버레이 + 이름/소속 -->
      <div class="p-left">
        <img class="p-img" src="./images/doctor.png" alt="박승현 원장" />
        <div class="p-overlay"></div>
        <div class="p-caption">
          <p class="p-name">박승현 원장</p>
          <p class="p-sub">전주W한의원 · 리셋다이어트</p>
        </div>
      </div>

      <!-- 우측: 앵커 카피 + 스토리 -->
      <div class="p-right">
        <p class="p-anchor">
          10년이 쌓은<br />
          <span class="hl">한 가지 확신</span>
        </p>
        <div class="p-rule"></div>
        <div class="p-story">
          <p class="p-story-lead">
            10년 이상 다이어트와 대사질환을 진료하며<br />
            반복해서 확인한 게 하나 있습니다.
          </p>
          <p class="p-story-close">
            갱년기 살은 의지의 문제가 아닙니다.<br />
            <span class="punch">방법이 달라야 합니다.</span>
          </p>
        </div>
      </div>

    </div>
  </section>

</body>
</html>
